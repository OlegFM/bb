name: CI

on:
  push:
    branches:
      - main
      - "windows-native/**"
  pull_request:
  workflow_dispatch:

env:
  PRIMARY_NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request pushes are wasted work, but superseded main pushes
  # are not: a cancelled run never reaches its post step, so it never saves a
  # Turbo cache. Cancelling them let a burst of merges leave every pull request
  # restoring from a main commit well behind HEAD.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks (ubuntu-latest, Node 22.x)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    # `actions: read` is what lets the cache-usage check call the Actions API;
    # checkout needs `contents: read`. The check degrades to a skip without
    # them, so this only makes the reporting reliable.
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check source files for literal NUL bytes
        run: node scripts/check-source-nul.mjs

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: checks

      # Four tasks for four vCPUs: TypeScript 7 and esbuild are multi-threaded,
      # so turbo's default of ten concurrent tasks only adds contention here.
      # Measured pinned to 4 CPUs, two rounds each: 96 s / 110 s at the
      # default vs 90 s / 58 s at four.
      - name: Build, typecheck, and lint
        run: pnpm exec turbo run build typecheck lint --cache-dir=.turbo/cache --output-logs=new-only --concurrency=4

      # Runs after build and typecheck, so the guard's own turbo build is a
      # cache hit and the package it packs is the one this commit really ships.
      # A published version whose packed files or consumer-facing manifest
      # fields changed is a hard failure; an unreachable registry or a failed
      # local pack (exit 2) is infrastructure, not a finding.
      - name: Check plugin SDK npm version guard
        run: |
          # +e so the exit code can be inspected: GitHub's default shell runs
          # with -e, which would abort the step before the exit-2 check.
          set +e
          node packages/plugin-sdk/scripts/check-npm-version-guard.mjs
          guard_exit=$?
          set -e
          if [[ "$guard_exit" -eq 2 ]]; then
            echo "::warning::Skipping the plugin SDK npm version guard: the npm registry was unreachable."
            exit 0
          fi
          exit "$guard_exit"

      # Guards the JavaScript that blocks first paint in the web app, and the
      # thread route's static closure that blocks first thread paint. Heavy
      # editor, diff and math code reaches those paths through barrel
      # re-exports, which typecheck and lint cannot see.
      - name: Check app bundle budgets
        run: node apps/app/scripts/check-bundle-budget.mjs

      # Provider-literal ratchet (G1 of the provider-plugin migration):
      # core must never gain a new provider-id carve-out; the per-file
      # baseline may only shrink. See docs/provider-plugin-api.md.
      - name: Check provider-literal ratchet
        run: |
          git fetch --depth=1 origin "${{ github.base_ref || github.event.repository.default_branch }}" || true
          node scripts/check-provider-literal-ratchet.mjs --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"

      # Exceeding the Actions cache quota is silent: GitHub evicts entries
      # without failing or warning anything, so the only symptom is caches
      # quietly ceasing to hit. Warn while there is still headroom.
      - name: Check Actions cache usage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-actions-cache-usage.mjs

  # Tests run on their own runners instead of inside the checks job: the big
  # suites are CPU-bound and previously fought each other (and the builds) for
  # the same 4 vCPUs, which made tests the critical path of every run.
  tests:
    name: Tests (${{ matrix.shard }}, ubuntu-latest, Node 22.x)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server
            filter: --filter=@bb/server
            args: ""
          # @bb/app is by far the largest suite (365 files) and was the critical
          # path once the macOS smoke leg was fixed. Vitest splits by file, and
          # Turbo hashes passthrough args, so each leg is a distinct cache entry
          # rather than three jobs racing to reuse one.
          - shard: app-1
            filter: --filter=@bb/app
            args: -- --shard=1/3
          - shard: app-2
            filter: --filter=@bb/app
            args: -- --shard=2/3
          - shard: app-3
            filter: --filter=@bb/app
            args: -- --shard=3/3
          - shard: integration
            filter: --filter=@bb/integration-tests
            args: ""
          - shard: packages
            filter: --filter='!@bb/server' --filter='!@bb/app' --filter='!@bb/integration-tests'
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: test-${{ matrix.shard }}

      - name: Setup Bun
        if: ${{ matrix.shard == 'packages' }}
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.3.14"

      - name: Install Electron runtime libraries
        if: ${{ matrix.shard == 'packages' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64
          ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version

      - name: Test
        run: pnpm exec turbo run test ${{ matrix.filter }} --cache-dir=.turbo/cache --output-logs=new-only --concurrency=4 ${{ matrix.args }}

  # Every other suite mocks the Agent SDK, so an upstream CLI release that
  # breaks the model probe passes CI silently. This runs it against a real,
  # unpinned CLI.
  # TODO: cover the npm build, macOS, and the full `test:integration` suite.
  plugin-forks:
    name: Plugin Fork Check (ubuntu-latest, Node 22.x)
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: plugin-forks

      - name: Build, typecheck, and test forkable plugins outside the workspace
        run: node scripts/check-plugin-forks.mjs

  provider-model-listing:
    name: Provider Model Listing
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20

    # Fork pull requests cannot read secrets, so the probe would fail
    # unauthenticated for reasons unrelated to bb.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: test-provider-model-listing

      # The native build: bb resolves `claude` from PATH and `~/.local/bin`,
      # so this is the binary most users run.
      - name: Install Claude Code CLI
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Show Claude Code version
        run: claude --version

      # Fails here, where the cause is obvious, rather than inside the probe.
      - name: Check Claude Code credential
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN is unset; mint one with 'claude setup-token'." >&2
            exit 1
          fi

      # `--force`: the input that moves here is the upstream CLI, which Turbo
      # does not hash.
      - name: Probe Claude Code model listing
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: pnpm exec turbo run test:integration --filter=@bb/agent-runtime --cache-dir=.turbo/cache --output-logs=new-only --force -- -t "claude-code provider lists models"

  # The macOS legs run without the Turbo cache. Blacksmith's transparent cache
  # only backs their Linux runners, so on macOS the cache moves over GitHub's
  # own service at ~50 MB/s: restoring and saving the ~2 GB directory cost about
  # two minutes per run and returned 0 of 8 task hits, because the six ~2 GB
  # entries it wrote also blew past the repository's 10 GB cache quota and
  # evicted each other. `smoke:tarball` is itself `"cache": false`, so only its
  # build dependencies could ever have been reused.
  package-smoke:
    name: Package Smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            node-version: "22.x"
            turbo-cache: "true"
          - os: blacksmith-6vcpu-macos-15
            node-version: "22.x"
            turbo-cache: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: package-smoke
          turbo-cache: ${{ matrix.turbo-cache }}

      - name: Smoke bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --cache-dir=.turbo/cache --output-logs=new-only

      - name: Install AppImage FUSE runtime
        if: ${{ runner.os == 'Linux' }}
        uses: ./.github/actions/install-appimage-fuse
        timeout-minutes: 5
        with:
          package: libfuse2t64

      - name: Package Linux AppImage
        if: ${{ runner.os == 'Linux' }}
        run: pnpm exec turbo run desktop:build:linux --filter=@bb/desktop --cache-dir=.turbo/cache --output-logs=new-only

      - name: Smoke Linux AppImage mount lifecycle
        if: ${{ runner.os == 'Linux' }}
        run: xvfb-run -a pnpm exec turbo run smoke:appimage-lifecycle --filter=@bb/desktop --force --cache-dir=.turbo/cache --output-logs=new-only

  node-compat-smoke:
    name: Node Compatibility Smoke (${{ matrix.os }}, Node ${{ matrix.node-version }})
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: blacksmith-4vcpu-ubuntu-2404
            node-version: "24.x"
            turbo-cache: "true"
          - os: blacksmith-4vcpu-ubuntu-2404
            node-version: "26.x"
            turbo-cache: "true"
          - os: blacksmith-6vcpu-macos-15
            node-version: "24.x"
            turbo-cache: "false"
          - os: blacksmith-6vcpu-macos-15
            node-version: "26.x"
            turbo-cache: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace
        uses: ./.github/actions/setup-workspace
        with:
          node-version: ${{ matrix.node-version }}
          pnpm-version: ${{ env.PNPM_VERSION }}
          cache-prefix: compat-smoke
          turbo-cache: ${{ matrix.turbo-cache }}

      - name: Smoke bb-app tarball
        run: pnpm exec turbo run smoke:tarball --filter=bb-app --cache-dir=.turbo/cache --output-logs=new-only

  # It bypasses ./.github/actions/setup-workspace because install-pnpm.sh has
  # no MINGW64_NT case and no pnpm-win-x64 checksum, and it carries no Turbo
  # cache for the same reason the macOS legs do not.
  windows-x64:
    name: Windows x64 (windows-2025, Node 22.x)
    # Pinned rather than windows-latest so the toolchain the port is measured
    # against changes only when we choose it.
    runs-on: windows-2025
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Load native add-ons
        run: node qa/windows/scripts/conpty-load-check.mjs

      - name: Smoke ConPTY
        run: |
          New-Item -ItemType Directory -Force qa-artifacts | Out-Null
          pnpm exec turbo run smoke:windows-conpty --filter=@bb/desktop --output-logs=new-only 2>&1 | Tee-Object -FilePath qa-artifacts/conpty-smoke.txt
          exit $LASTEXITCODE

      - name: Typecheck and build
        run: >-
          pnpm exec turbo run typecheck build
          --filter=@bb/domain
          --filter=@bb/process-utils
          --filter=@bb/host-daemon
          --filter=@bb/desktop
          --filter=@bb/scripts
          --filter=bb-app
          --output-logs=new-only

      - name: Test Windows machine dialog
        run: pnpm.cmd exec turbo run test --filter=@bb/app --output-logs=new-only -- --maxWorkers=2 src/components/dialogs/AddMachineDialog.test.tsx

      - name: Test Windows workspace and Desktop regressions
        env:
          TMP: ${{ github.workspace }}\.smoke-temp
          TEMP: ${{ github.workspace }}\.smoke-temp
        run: |
          New-Item -ItemType Directory -Force "$env:TEMP" | Out-Null
          pnpm.cmd exec turbo run test --filter=@bb/host-workspace --output-logs=new-only -- --maxWorkers=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd exec turbo run test --filter=@bb/local-open-targets --filter=@bb/secret-storage --filter=@bb/desktop --continue --concurrency=1 --output-logs=new-only -- --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd exec turbo run test --filter=@bb/host-daemon --output-logs=new-only -- --maxWorkers=2 src/desktop-browser-broker.test.ts
          exit $LASTEXITCODE

      - name: Test Windows server regressions
        env:
          TMP: ${{ github.workspace }}\.smoke-temp
          TEMP: ${{ github.workspace }}\.smoke-temp
        run: |
          New-Item -ItemType Directory -Force "$env:TEMP" | Out-Null
          $taskIso = Join-Path $env:TEMP 'server-test-isolation'
          @('profile', 'profile/AppData/Roaming', 'profile/AppData/Local', 'gh', 'npm-cache') |
            ForEach-Object { New-Item -ItemType Directory -Force -Path (Join-Path $taskIso $_) | Out-Null }
          Set-Content -LiteralPath (Join-Path $taskIso 'gitconfig') -Value "[core]`n  longpaths = true`n  symlinks = true"
          Set-Content -LiteralPath (Join-Path $taskIso 'global.npmrc') -Value '' -NoNewline
          $npmCachePath = (Join-Path $taskIso 'npm-cache').Replace('\', '/')
          Set-Content -LiteralPath (Join-Path $taskIso 'user.npmrc') -Value "registry=http://127.0.0.1:1/`ncache=$npmCachePath"

          $removedNames = @(
            Get-ChildItem Env: |
              Where-Object {
                $_.Name -match '^(?i:(GH_|GITHUB_|NPM_CONFIG_|GIT_CONFIG_|GIT_ASKPASS$|SSH_ASKPASS$|SSH_AUTH_SOCK$|BB_DATA_DIR$|VSCODE_GIT_ASKPASS|GCM_))' -or
                $_.Name -match '(?i)(TOKEN|AUTH|PASSWORD|SECRET|API_KEY|CREDENTIAL)'
              } |
              Select-Object -ExpandProperty Name
          )
          foreach ($taskName in $removedNames) {
            [Environment]::SetEnvironmentVariable($taskName, $null, 'Process')
          }

          $env:HOME = Join-Path $taskIso 'profile'
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $taskIso 'profile/AppData/Roaming'
          $env:LOCALAPPDATA = Join-Path $taskIso 'profile/AppData/Local'
          $env:GIT_CONFIG_GLOBAL = Join-Path $taskIso 'gitconfig'
          $env:GIT_CONFIG_NOSYSTEM = '1'
          $env:GIT_TERMINAL_PROMPT = '0'
          $env:GCM_INTERACTIVE = 'never'
          $env:GH_CONFIG_DIR = Join-Path $taskIso 'gh'
          $env:NPM_CONFIG_USERCONFIG = Join-Path $taskIso 'user.npmrc'
          $env:NPM_CONFIG_GLOBALCONFIG = Join-Path $taskIso 'global.npmrc'
          Remove-Item Env:PSModulePath -ErrorAction SilentlyContinue

          pnpm.cmd exec turbo run test --filter=@bb/server --env-mode=loose --output-logs=new-only -- --maxWorkers=1
          exit $LASTEXITCODE

      - name: Set up Bun for Windows provider regression
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: "1.4.0"

      - name: Test Windows CLI and plugin runtime regressions
        env:
          TMP: ${{ github.workspace }}\.smoke-temp
          TEMP: ${{ github.workspace }}\.smoke-temp
        run: |
          pnpm.cmd exec turbo run test --filter=@bb/cli --output-logs=new-only -- --maxWorkers=2 src/__tests__/plugin-cli-broken-pipe.e2e.test.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd exec turbo run test --filter=@bb/plugin-build --output-logs=new-only -- --maxWorkers=2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm.cmd exec turbo run test --filter=bb-plugin-provider-pi --output-logs=new-only -- --maxWorkers=2
          exit $LASTEXITCODE

      # continue-on-error, not `|| true`: the step still renders as failed in
      # the run summary, so the baseline stays visible while the job stays
      # green. --continue so one package's failures do not hide the others'.
      - name: Test (Windows baseline)
        id: windows-test
        continue-on-error: true
        run: >-
          pnpm exec turbo run test
          --filter=@bb/domain
          --filter=@bb/process-utils
          --filter=@bb/host-daemon
          --filter=@bb/scripts
          --filter=bb-app
          --continue
          --summarize
          --output-logs=new-only

      # The runner's profile temp (C:\Users\RUNNER~1\AppData\Local\Temp) keeps
      # SYSTEM and BUILTIN\Administrators on files created there even after
      # `icacls /inheritance:r /grant:r`, so bb's private-secret check refuses
      # to start a server whose data directory lives under it. Give the smoke a
      # workspace-local temp root instead.
      - name: Smoke bb-app tarball
        env:
          TMP: ${{ github.workspace }}\.smoke-temp
          TEMP: ${{ github.workspace }}\.smoke-temp
        run: |
          New-Item -ItemType Directory -Force "$env:TEMP" | Out-Null
          pnpm exec turbo run smoke:tarball --filter=bb-app --output-logs=new-only
          exit $LASTEXITCODE

      # electron-builder downloads the winCodeSign toolchain on first use even
      # for an unsigned `--dir` build, so this step is the one that pays for the
      # cache miss. The smokes below reuse the unpacked tree it leaves behind.
      - name: Package Windows desktop (unpacked)
        env:
          TMP: ${{ github.workspace }}\.smoke-temp
          TEMP: ${{ github.workspace }}\.smoke-temp
        run: |
          New-Item -ItemType Directory -Force "$env:TEMP" | Out-Null
          pnpm --filter @bb/desktop run package:windows
          exit $LASTEXITCODE

      - name: Smoke packaged desktop app
        env:
          TMP: ${{ github.workspace }}\.smoke-temp
          TEMP: ${{ github.workspace }}\.smoke-temp
        run: |
          pnpm exec turbo run smoke:packaged --filter=@bb/desktop --force --output-logs=new-only
          exit $LASTEXITCODE

      - name: Smoke Windows process hygiene
        env:
          TMP: ${{ github.workspace }}\.smoke-temp
          TEMP: ${{ github.workspace }}\.smoke-temp
        run: |
          New-Item -ItemType Directory -Force "$env:TEMP" | Out-Null
          pnpm exec turbo run smoke:windows-processes --filter=@bb/desktop --output-logs=new-only -- --evidence-dir qa-artifacts/process-hygiene
          exit $LASTEXITCODE

      - name: Upload Windows test run summaries
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64-test-results
          # Turbo runs the process-hygiene smoke with apps/desktop as its
          # working directory, so its --evidence-dir resolves inside the
          # package rather than at the workspace root.
          path: |
            .turbo/runs/*.json
            qa-artifacts/conpty-smoke.txt
            apps/desktop/qa-artifacts/process-hygiene/*.json
          if-no-files-found: warn
